replicaCount: 2

image:
  # The CI pipeline rewrites `tag` on every build (GitOps). Repository is set
  # to your ECR by the setup step / CI env.
  repository: 589389425618.dkr.ecr.us-east-1.amazonaws.com/demo-app
  tag: "d2681ce3e6e3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Readiness/liveness use the app's /healthz endpoint
healthCheck:
  path: /healthz
  port: 5000

# Prometheus scrape annotation so the monitoring stack picks up /metrics
metrics:
  enabled: true
  path: /metrics
  port: 5000

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilization: 70

# Non-secret runtime config, injected into the app via a ConfigMap (envFrom).
# Change these, commit, and ArgoCD re-syncs — no image rebuild needed.
config:
  appVersion: "1.0.0"
  logLevel: "info"
  greeting: "Hello from the Automated DevOps Flow demo"
