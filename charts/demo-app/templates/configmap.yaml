apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app: {{ .Release.Name }}
data:
  # Non-secret config the app reads at runtime. Change these in values.yaml,
  # commit, and ArgoCD re-syncs — the app picks up new config without a rebuild.
  # (Secrets like passwords/API keys do NOT belong here — use a Secret.)
  APP_VERSION: {{ .Values.config.appVersion | quote }}
  LOG_LEVEL:   {{ .Values.config.logLevel | quote }}
  GREETING:    {{ .Values.config.greeting | quote }}
