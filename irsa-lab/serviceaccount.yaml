# The ServiceAccount that the IAM role trusts. The annotation is what links
# this SA to the IAM role — EKS's pod-identity webhook sees it and injects the
# AWS creds (a projected OIDC token + AWS_ROLE_ARN) into any pod using this SA.
#
# REPLACE the role ARN below with `terraform output -raw role_arn` from irsa.tf.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: irsa-demo-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::589389425618:role/irsa-lab-demo-role
